# Nginx - site vitrine BUILD FRANCE
# Remplacez buildfrance.fr par votre domaine, puis :
#   sudo cp deploy/nginx-buildfrance-site.conf /etc/nginx/sites-available/buildfrance-site
#   sudo ln -s /etc/nginx/sites-available/buildfrance-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d buildfrance.fr -d www.buildfrance.fr     (HTTPS + redirection automatiques)

server {
    listen 80;
    listen [::]:80;
    server_name buildfrance.fr www.buildfrance.fr;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
